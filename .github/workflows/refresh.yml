name: Refresh Signal Bench

on:
  schedule:
    - cron: "17 * * * *"   # hourly; only commits when something changed
  push:
    branches: [main]
    paths: [index.html]   # a new design copy dropped in gets its website additions right away
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build page (website additions + latest payload from Drive)
        id: build
        continue-on-error: true
        run: python3 refresh_payload.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
          else
            git config user.name "signal-bench-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Refresh page $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
      - name: Fail if the payload could not be loaded
        if: steps.build.outcome == 'failure'
        run: exit 1
