name: Refresh Signal Bench

on:
  schedule:
    # UTC times. 11:20 UTC = 6:20 AM Central (daylight) / 5:20 AM (standard),
    # after the Mac's 5 AM build has synced to Drive. Later runs are catch-ups.
    - cron: "20 11 * * *"
    - cron: "20 13 * * *"
    - cron: "20 17 * * *"
    - cron: "20 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull latest payload from Drive
        run: python3 refresh_payload.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
          else
            git config user.name "signal-bench-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Refresh payload $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
